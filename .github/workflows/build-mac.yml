name: Build Mac Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Root dependencies (electron-builder etc.) ──────────────────────────
      - name: Install root dependencies
        run: npm install

      # ── Backend ───────────────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Electron ──────────────────────────────────────────────────────────
      - name: Generate Google Drive credentials file
        run: |
          cat > electron/gdrive-credentials.ts <<'EOF'
          export const GDRIVE_CLIENT_ID = '${{ secrets.GDRIVE_CLIENT_ID }}';
          export const GDRIVE_CLIENT_SECRET = '${{ secrets.GDRIVE_CLIENT_SECRET }}';
          EOF

      - name: Compile Electron TypeScript
        run: npx tsc --project electron/tsconfig.json

      # Rebuild native modules (sqlite3) for the Electron Node.js version
      - name: Rebuild native modules for Electron
        run: npx electron-rebuild --force --module-dir backend

      # ── Package ───────────────────────────────────────────────────────────
      - name: Build Mac installer
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload Mac installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist-electron/*.dmg
          retention-days: 90

      # ── Create/update GitHub Release with the .dmg ────────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: "Steel & Cement POS"
          body: "Mac installer — open the .dmg and drag the app to Applications."
          files: dist-electron/*.dmg
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
