name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # ── Root dependencies (electron-builder etc.) ──────────────────────────
      - name: Install root dependencies
        shell: cmd
        run: npm ci

      # ── Backend ───────────────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        shell: cmd
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        shell: cmd
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting frontend build at $(Get-Date)"
          Write-Host "Working directory: $(Get-Location)"
          Write-Host "package.json build script:"
          Get-Content package.json

          npm.cmd run build
          $buildExitCode = $LASTEXITCODE

          Write-Host "Frontend build exit code: $buildExitCode at $(Get-Date)"

          if ($buildExitCode -ne 0) {
            throw "Frontend build failed with exit code $buildExitCode"
          }

          if (-not (Test-Path "dist/index.html")) {
            throw "Frontend build completed but dist/index.html was not generated"
          }

          Write-Host "Frontend build output:"
          Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

          Write-Host "Active node processes after frontend build:"
          Get-Process node -ErrorAction SilentlyContinue

          Write-Host "Frontend build finished successfully at $(Get-Date)"

      # ── Electron ──────────────────────────────────────────────────────────
      - name: Generate Google Drive credentials file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "electron" | Out-Null
          @"
          export const GDRIVE_CLIENT_ID = '${{ secrets.GDRIVE_CLIENT_ID }}';
          export const GDRIVE_CLIENT_SECRET = '${{ secrets.GDRIVE_CLIENT_SECRET }}';
          "@ | Set-Content -Path "electron/gdrive-credentials.ts"
          if (-not (Test-Path "electron/gdrive-credentials.ts")) {
            throw "Failed to generate electron/gdrive-credentials.ts"
          }

      - name: Compile Electron TypeScript
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Compiling Electron TypeScript at $(Get-Date)"
          npx.cmd tsc --project electron/tsconfig.json
          if ($LASTEXITCODE -ne 0) {
            throw "Electron TypeScript compilation failed with exit code $LASTEXITCODE"
          }
          Write-Host "Electron TypeScript compile finished at $(Get-Date)"

      # Rebuild native modules (sqlite3) for the Electron Node.js version
      - name: Rebuild native modules for Electron
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Rebuilding native modules at $(Get-Date)"
          npm.cmd run rebuild:native
          if ($LASTEXITCODE -ne 0) {
            throw "Native rebuild failed with exit code $LASTEXITCODE"
          }
          Write-Host "Native rebuild finished at $(Get-Date)"
        env:
          DEBUG: electron-rebuild*

      # ── Package ───────────────────────────────────────────────────────────
      - name: Build Windows installer
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Starting electron-builder at $(Get-Date)"
          npx.cmd electron-builder --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) {
            throw "electron-builder failed with exit code $LASTEXITCODE"
          }
          Write-Host "electron-builder output files:"
          Get-ChildItem -Path dist-electron -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "electron-builder finished at $(Get-Date)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload Windows installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
          retention-days: 90

      # ── Create/update GitHub Release with the .exe ────────────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: "Steel & Cement POS — Windows"
          body: "Windows installer — double-click to install."
          files: dist-electron/*.exe
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
