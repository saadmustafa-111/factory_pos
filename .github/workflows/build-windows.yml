name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # ── Root dependencies (electron-builder etc.) ──────────────────────────
      - name: Install root dependencies
        shell: cmd
        run: npm ci

      # ── Backend ───────────────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        shell: cmd
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        shell: cmd
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        shell: cmd
        timeout-minutes: 10
        run: npm run build

      # ── Electron ──────────────────────────────────────────────────────────
      - name: Generate Google Drive credentials file
        shell: pwsh
        run: |
          @"
          export const GDRIVE_CLIENT_ID = '${{ secrets.GDRIVE_CLIENT_ID }}';
          export const GDRIVE_CLIENT_SECRET = '${{ secrets.GDRIVE_CLIENT_SECRET }}';
          "@ | Set-Content -Path "electron/gdrive-credentials.ts"

      - name: Compile Electron TypeScript
        shell: cmd
        timeout-minutes: 10
        run: npx tsc --project electron/tsconfig.json

      # Rebuild native modules (sqlite3) for the Electron Node.js version
      - name: Rebuild native modules for Electron
        shell: cmd
        timeout-minutes: 15
        run: npm run rebuild:native
        env:
          DEBUG: electron-rebuild*

      # ── Package ───────────────────────────────────────────────────────────
      - name: Build Windows installer
        shell: cmd
        timeout-minutes: 20
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload Windows installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
          retention-days: 90

      # ── Create/update GitHub Release with the .exe ────────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: "Steel & Cement POS — Windows"
          body: "Windows installer — double-click to install."
          files: dist-electron/*.exe
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
